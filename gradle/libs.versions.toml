[versions]

# Readium Kotlin Toolkit (roadmap D2 / D18). Upgrading requires the full P0.2 checklist again.
readium = "3.4.0"

# AndroidX versions match the ones the Readium navigator already pulls in transitively so that
# Gradle resolution never downgrades a Readium requirement.
activity-ktx = "1.12.2"
appcompat = "1.8.0"
constraintlayout = "2.2.2"
core-ktx = "1.19.0"
fragment-ktx = "1.9.0"
lifecycle = "2.11.0"
webkit = "1.17.0"

# Coroutines version used by Readium 3.4.0.
coroutines = "1.11.0"

# AndroidX Media3 version pulled in by readium-navigator-media-tts 3.4.0; media3-session is declared
# directly because the read-aloud foreground service subclasses MediaSessionService (roadmap P3).
media3 = "1.11.0"

# Jsoup version pulled in by readium-shared 3.4.0; declared directly because the EPUB service walks the
# XHTML DOM itself for chapter text (roadmap P5.2 / D30).
jsoup = "1.23.2"

# Compatibility of java.time.* for Android API Level < 26 (Android 8.0) [O]; kotlinx-datetime needs it.
desugar = "2.1.5"

material = "1.13.0"

# build-logic (org.autojs.build.utils) archive helpers.
commons-compress = "1.28.0"
xz = "1.10"

foojay-resolver-convention = "1.0.0"
junit = "4.13.2"
# Real org.json for JVM unit tests: android.jar only ships stubs, and the progress codec uses JSONObject.
org-json = "20260814"
test-espresso-core = "3.7.0"
test-junit-version = "1.3.0"
test-rules = "1.7.0"
test-runner = "1.7.0"

[libraries]

activity-ktx = { module = "androidx.activity:activity-ktx", version.ref = "activity-ktx" }
apache-commons-compress = { module = "org.apache.commons:commons-compress", version.ref = "commons-compress" }
appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
desugar = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugar" }
fragment-ktx = { module = "androidx.fragment:fragment-ktx", version.ref = "fragment-ktx" }
junit = { module = "junit:junit", version.ref = "junit" }
lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
material = { module = "com.google.android.material:material", version.ref = "material" }
media3-session = { module = "androidx.media3:media3-session", version.ref = "media3" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
org-json = { module = "org.json:json", version.ref = "org-json" }
readium-navigator = { module = "org.readium.kotlin-toolkit:readium-navigator", version.ref = "readium" }
readium-navigator-media-tts = { module = "org.readium.kotlin-toolkit:readium-navigator-media-tts", version.ref = "readium" }
readium-shared = { module = "org.readium.kotlin-toolkit:readium-shared", version.ref = "readium" }
readium-streamer = { module = "org.readium.kotlin-toolkit:readium-streamer", version.ref = "readium" }
test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "test-espresso-core" }
test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "test-junit-version" }
test-rules = { module = "androidx.test:rules", version.ref = "test-rules" }
test-runner = { module = "androidx.test:runner", version.ref = "test-runner" }
tukaani-xz = { module = "org.tukaani:xz", version.ref = "xz" }
webkit = { module = "androidx.webkit:webkit", version.ref = "webkit" }

[plugins]

foojay-resolver-convention = { id = "org.gradle.toolchains.foojay-resolver-convention", version.ref = "foojay-resolver-convention" }
